name: Android Sensor

on:
  pull_request:
    paths:
      - "apps/android-sensor/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android-sensor/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android-sensor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: radar-sensor-v0.3.0-connected-debug
          path: apps/android-sensor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
