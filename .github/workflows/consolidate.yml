name: Consolidate Radar

# O agendamento saiu daqui em 2026-09-05 (D-024, docs/DECISIONS.md): medido,
# o schedule: do GitHub Actions ficou ~19h sem disparar neste repositório, em
# dois workflows independentes. private.radar_cron_consolidate() no próprio
# Supabase assumiu o disparo, nos mesmos seis horários. Este workflow continua
# existindo para disparo manual/depuração.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require consolidation configuration
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: node packages/supabase-core/scripts/check-consolidation-config.mjs
      - name: Process canonical Radar window
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: node packages/supabase-core/scripts/run-consolidation.mjs
