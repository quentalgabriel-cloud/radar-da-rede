name: Consolidate Radar

on:
  schedule:
    # America/Recife is UTC-03:00: 08:00, 13:00 and 18:00 local.
    - cron: "0 11,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check consolidation configuration
        id: configuration
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: |
          if [ -n "$RADAR_SUPABASE_URL" ] && [ -n "$RADAR_NETWORK_ID" ] && [ -n "$RADAR_PROCESSING_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Consolidation is not active: configure the three RADAR secrets."
          fi
      - name: Process canonical Radar window
        if: steps.configuration.outputs.configured == 'true'
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: node packages/supabase-core/scripts/run-consolidation.mjs
