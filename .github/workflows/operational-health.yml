name: Radar Operational Health

# Mantido em paralelo com private.radar_cron_health_check() (pg_cron, dentro
# do Supabase) por um motivo específico: este workflow falha visivelmente
# (X vermelho no GitHub) quando a rede não está saudável, e um cron dentro do
# banco não tem esse tipo de sinal por natureza. Confirmado em 2026-09-05 que
# o schedule: abaixo ficou sem disparar por ~19h — mas se a causa for
# transitória do lado do GitHub, este caminho volta a valer sozinho, sem
# nenhuma mudança. Perder essa redundância custaria mais do que mantê-la.
on:
  schedule:
    # Entre os slots de consolidação, para que uma parada apareça em menos de
    # duas horas em vez de esperar alguém estranhar o dado.
    - cron: "30 1,5,9,13,17,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-operational-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require consolidation configuration
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: node packages/supabase-core/scripts/check-consolidation-config.mjs
      - name: Check Radar operational health
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_NETWORK_ID: ${{ secrets.RADAR_NETWORK_ID }}
          RADAR_PROCESSING_SECRET: ${{ secrets.RADAR_PROCESSING_SECRET }}
        run: node packages/supabase-core/scripts/check-operational-health.mjs
