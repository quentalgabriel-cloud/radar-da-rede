        version: link:../contracts
      '@radar-rede/testkit':
        specifier: workspace:*
        version: link:../testkit

  packages/radar-view-model:
    dependencies:
      '@radar-rede/group-analytics':
        specifier: workspace:*
        version: link:../group-analytics
      '@radar-rede/intelligence':
        specifier: workspace:*
        version: link:../intelligence
      '@radar-rede/testkit':
        specifier: workspace:*
        version: link:../testkit

  packages/supabase-core: {}

  packages/testkit:
    dependencies:
      '@radar-rede/contracts':
        specifier: workspace:*
        version: link:../contracts

