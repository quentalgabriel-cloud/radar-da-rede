lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  apps/android-sensor: {}

  apps/core-simulator:
    dependencies:
      '@radar-rede/core':
        specifier: workspace:*
        version: link:../../packages/core

  apps/fake-sensor:
    dependencies:
      '@radar-rede/testkit':
        specifier: workspace:*
        version: link:../../packages/testkit

  apps/radar-web:
    dependencies:
      '@radar-rede/radar-view-model':
        specifier: workspace:*
        version: link:../../packages/radar-view-model
      '@radar-rede/testkit':
        specifier: workspace:*
        version: link:../../packages/testkit
