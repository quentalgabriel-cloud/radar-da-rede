    engines: {node: '>=20'}
    hasBin: true

  playwright@1.62.1:
    resolution: {integrity: sha512-0M+L3LAD8/nm554LOla9Ayx0j0tmFZ0FBcoQ7F1VuVHpM/XpiC8RcDzBQB8W5+hA8L22THxELzeF+2WcUzvcLg==}
    engines: {node: '>=20'}
    hasBin: true

snapshots:

